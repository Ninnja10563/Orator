name: macOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test model and file interoperability
        run: swift test
      - name: Build Apple Silicon app
        run: scripts/build-app.sh
      - name: Build host app for launch verification
        run: ORATOR_ARCH="$(uname -m)" scripts/build-app.sh
      - name: Launch document editor and render a slide
        run: ORATOR_SMOKE_OUTPUT="$PWD/build/smoke.tiff" build/Orator.app/Contents/MacOS/Orator --smoke-test
      - name: Launch and verify editing in dark appearance
        run: ORATOR_SMOKE_OUTPUT="$PWD/build/smoke-dark.tiff" build/Orator.app/Contents/MacOS/Orator --smoke-test --dark
      - name: Check exported PPTX with an independent library
        run: |
          python3 -m venv /tmp/orator-validation
          /tmp/orator-validation/bin/pip install python-pptx==1.0.2
          /tmp/orator-validation/bin/python scripts/pptx-fixtures.py build/smoke.pptx
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate exported Office XML schemas
        run: dotnet run --project scripts/ValidateOOXML -- build/smoke.pptx build/compatibility.pptx
      - name: Restore arm64 distribution
        run: scripts/build-app.sh
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent build/Orator.app build/Orator-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orator-macOS-arm64
          path: |
            build/Orator-macOS-arm64.zip
            build/smoke.tiff
            build/workspace.png
            build/workspace-dark.png
            build/smoke.pptx
            build/compatibility.pptx
