name: macOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test model and file interoperability
        run: swift test
      - name: Build Apple Silicon app
        run: scripts/build-app.sh
      - name: Build host app for launch verification
        run: ORATOR_ARCH="$(uname -m)" scripts/build-app.sh
      - name: Launch document editor and render a slide
        run: ORATOR_SMOKE_OUTPUT="$PWD/build/smoke.tiff" build/Orator.app/Contents/MacOS/Orator --smoke-test
      - name: Restore arm64 distribution
        run: scripts/build-app.sh
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent build/Orator.app build/Orator-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Orator-macOS-arm64
          path: |
            build/Orator-macOS-arm64.zip
            build/smoke.tiff
